services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NGUYEN_ENV=production
      - DATABASE_DSN=postgres://nguyen:nguyen@db:5432/nguyen_db?sslmode=disable
      - JWT_SECRET=change-me-in-production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nguyen
      POSTGRES_PASSWORD: nguyen
      POSTGRES_DB: nguyen_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nguyen"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
